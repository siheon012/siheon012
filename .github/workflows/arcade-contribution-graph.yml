name: generate arcade contribution graph

on:
  schedule:
    # 매일 00:00 UTC (KST 09:00) 에 갱신
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          # 여러 개를 뽑아두고 README 에서 원하는 것만 골라 쓴다
          games: 'bomberman,galaga,minesweeper,puzzle-bobble,breakout'

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
